[pytest]

addopts =
    -v
    -s
    --tb=short
    --alluredir=allure-results

testpaths =
    tests

python_files =
    test_*.py

python_functions =
    test_*

markers =
    serial: marks tests that must run sequentially (deselect with '-m "not serial"')
    rate_limit: marks tests related to rate limiting (deselect with '-m "not rate_limit"')
    
